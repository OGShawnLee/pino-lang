name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # tooling/ is gitignored, so a clean checkout has no C toolchain. TinyCC 0.9.27 (win64) is pinned by version and SHA256.
      - name: Restore TinyCC 0.9.27 from cache
        id: tcc-cache
        uses: actions/cache@v6
        with:
          path: tooling/tcc
          key: tinycc-0.9.27-win64-34a721949a2583fdff725312dda92fa0f5f1f284b702e6f811c6954714faabb2

      - name: Download and verify TinyCC 0.9.27
        if: steps.tcc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          TCC_URL: https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.27-win64-bin.zip
          TCC_SHA256: 34A721949A2583FDFF725312DA092FA0F5F1F284B702E6F811C6954714FAABB2
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'tcc.zip'
          curl.exe --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --output $zip $env:TCC_URL
          if ($LASTEXITCODE -ne 0) { throw "Downloading TinyCC from $env:TCC_URL failed." }
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $env:TCC_SHA256) { throw "TinyCC SHA256 mismatch: expected $env:TCC_SHA256 but got $actual." }
          New-Item -ItemType Directory -Force -Path tooling | Out-Null
          # The archive's top-level folder is tcc/, so this produces tooling/tcc/tcc.exe.
          Expand-Archive -Path $zip -DestinationPath tooling -Force

      - name: Check TinyCC is in place
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path tooling/tcc/tcc.exe)) { throw 'tooling/tcc/tcc.exe is missing after the TinyCC step.' }
          & tooling/tcc/tcc.exe -v

      - name: Build the new compiler
        run: dotnet build pino-csharp-re/Pino.sln -warnaserror

      - name: Check formatting
        run: dotnet format pino-csharp-re/Pino.sln --verify-no-changes

      # cmd with "< NUL" closes stdin: a gcc-built test program waits on an open stdin and times out.
      - name: Test the new compiler
        shell: cmd
        env:
          PINO_TEST_TIME_SCALE: '5'
        run: dotnet test pino-csharp-re/Pino.sln --no-build --logger trx --results-directory TestResults/re < NUL

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  build-and-test-linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the new compiler
        run: dotnet build pino-csharp-re/Pino.sln -warnaserror

      - name: Test the new compiler
        shell: bash
        env:
          PINO_TEST_TIME_SCALE: '5'
        run: dotnet test pino-csharp-re/Pino.sln --no-build --logger trx --results-directory TestResults/linux < /dev/null

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  build-and-test-macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the new compiler
        run: dotnet build pino-csharp-re/Pino.sln -warnaserror

      - name: Test the new compiler
        shell: bash
        env:
          PINO_TEST_TIME_SCALE: '5'
        run: dotnet test pino-csharp-re/Pino.sln --no-build --logger trx --results-directory TestResults/macos < /dev/null

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: TestResults/**/*.trx
          if-no-files-found: ignore
