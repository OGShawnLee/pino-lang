name: Release compiler binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: pino-windows-x64
            file_name: pino-windows-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: pino-linux-x64
            file_name: pino-linux-x64.tar.gz
          - os: macos-15-intel
            rid: osx-x64
            artifact_name: pino-macos-x64
            file_name: pino-macos-x64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            artifact_name: pino-macos-arm64
            file_name: pino-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Windows x64: official TinyCC 0.9.27 win64 binary, pinned by SHA256.
      - name: Restore TinyCC 0.9.27 (Windows) from cache
        if: matrix.rid == 'win-x64'
        id: tcc-win-cache
        uses: actions/cache@v4
        with:
          path: tooling/tcc
          key: tinycc-0.9.27-win64-34a721949a2583fdff725312dda92fa0f5f1f284b702e6f811c6954714faabb2

      - name: Download and verify TinyCC 0.9.27 (Windows)
        if: matrix.rid == 'win-x64' && steps.tcc-win-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          TCC_URL: https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.27-win64-bin.zip
          TCC_SHA256: 34A721949A2583FDFF725312DA092FA0F5F1F284B702E6F811C6954714FAABB2
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'tcc.zip'
          curl.exe --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --output $zip $env:TCC_URL
          if ($LASTEXITCODE -ne 0) { throw "Downloading TinyCC from $env:TCC_URL failed." }
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $env:TCC_SHA256) { throw "TinyCC SHA256 mismatch: expected $env:TCC_SHA256 but got $actual." }
          New-Item -ItemType Directory -Force -Path tooling | Out-Null
          Expand-Archive -Path $zip -DestinationPath tooling -Force

      # Linux x64: build unmodified TinyCC 0.9.27 from the official source tarball, pinned by SHA256.
      - name: Build TinyCC 0.9.27 from source (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        env:
          TCC_SRC_URL: https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.27.tar.bz2
          TCC_SRC_SHA256: de23af78fca90ce32dff2dd45b3432b2334740bb9bb7b05bf60fdbfc396ceb9c
        run: |
          set -euo pipefail
          BUILD_ROOT="$RUNNER_TEMP/tcc-build"
          STAGE_DIR="$RUNNER_TEMP/tcc-linux-stage"
          rm -rf "$BUILD_ROOT" "$STAGE_DIR"
          mkdir -p "$BUILD_ROOT" "$STAGE_DIR"
          TARBALL="$BUILD_ROOT/tcc-0.9.27.tar.bz2"

          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --output "$TARBALL" "$TCC_SRC_URL"
          ACTUAL="$(sha256sum "$TARBALL" | awk '{print $1}')"
          if [ "$ACTUAL" != "$TCC_SRC_SHA256" ]; then
            echo "TinyCC source SHA256 mismatch: expected $TCC_SRC_SHA256 but got $ACTUAL." >&2
            exit 1
          fi

          tar -xjf "$TARBALL" -C "$BUILD_ROOT"
          cd "$BUILD_ROOT/tcc-0.9.27"
          ./configure \
            --prefix="$STAGE_DIR" \
            --bindir="$STAGE_DIR" \
            --tccdir="$STAGE_DIR" \
            --libdir="$STAGE_DIR/lib" \
            --includedir="$STAGE_DIR/include" \
            --crtprefix="/usr/lib/x86_64-linux-gnu:/usr/lib64:/usr/lib" \
            --sysincludepaths="{B}/include:/usr/local/include/x86_64-linux-gnu:/usr/local/include:/usr/include/x86_64-linux-gnu:/usr/include" \
            --libpaths="{B}:{B}/lib:/usr/lib/x86_64-linux-gnu:/usr/lib64:/usr/lib:/lib/x86_64-linux-gnu:/lib64:/lib" \
            --extra-cflags="-O2 -Wno-error=strict-prototypes -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types"
          make -j"$(nproc)"
          make install
          cp COPYING "$STAGE_DIR/COPYING"
          rm -rf "$STAGE_DIR/share"

          "$STAGE_DIR/tcc" -v
          printf '#include <stdio.h>\n#include <math.h>\nint main(void) { printf("%%.1f\\n", floor(3.7)); return 0; }\n' > "$BUILD_ROOT/probe.c"
          "$STAGE_DIR/tcc" -B"$STAGE_DIR" "$BUILD_ROOT/probe.c" -lm -o "$BUILD_ROOT/probe"
          "$BUILD_ROOT/probe"

      - name: Package release archive (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .github/scripts/package-release.ps1 `
            -Rid '${{ matrix.rid }}' `
            -ArtifactName '${{ matrix.artifact_name }}' `
            -OutputDir '.' `
            -TccDir 'tooling/tcc'

      - name: Package release archive (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/package-release.sh \
            --rid '${{ matrix.rid }}' \
            --artifact-name '${{ matrix.artifact_name }}' \
            --output-dir '.' \
            --tcc-dir "$RUNNER_TEMP/tcc-linux-stage"

      - name: Package release archive (macOS)
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/package-release.sh \
            --rid '${{ matrix.rid }}' \
            --artifact-name '${{ matrix.artifact_name }}' \
            --output-dir '.'

      - name: Smoke test unpacked archive (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $InstallRoot = Join-Path $env:RUNNER_TEMP 'pino-smoke-install'
          $WorkRoot = Join-Path $env:RUNNER_TEMP 'pino-smoke-work'
          Remove-Item -Recurse -Force $InstallRoot, $WorkRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $InstallRoot, $WorkRoot | Out-Null

          Expand-Archive -Path '${{ matrix.file_name }}' -DestinationPath $InstallRoot -Force
          $PinoDir = Join-Path $InstallRoot '${{ matrix.artifact_name }}'
          if (-not (Test-Path (Join-Path $PinoDir 'pino.exe'))) {
            throw "Expected unpacked executable at '$PinoDir\pino.exe'."
          }

          $env:PATH = "$PinoDir;$env:PATH"
          Push-Location $WorkRoot
          try {
            pino version
            if ($LASTEXITCODE -ne 0) { throw "pino version failed ($LASTEXITCODE)." }

            pino init demo
            if ($LASTEXITCODE -ne 0) { throw "pino init demo failed ($LASTEXITCODE)." }

            Set-Location (Join-Path $WorkRoot 'demo')

            pino run
            if ($LASTEXITCODE -ne 0) { throw "pino run failed ($LASTEXITCODE)." }

            cmd /c "pino run --c < NUL"
            if ($LASTEXITCODE -ne 0) { throw "pino run --c failed ($LASTEXITCODE)." }

            pino test
            if ($LASTEXITCODE -ne 0) { throw "pino test failed ($LASTEXITCODE)." }

            cmd /c "pino test --c < NUL"
            if ($LASTEXITCODE -ne 0) { throw "pino test --c failed ($LASTEXITCODE)." }

            cmd /c "pino play star_pino < NUL"
            if ($LASTEXITCODE -ne 0) { throw "pino play star_pino failed ($LASTEXITCODE)." }
          } finally {
            Pop-Location
          }

      - name: Smoke test unpacked archive (Unix)
        if: matrix.rid != 'win-x64'
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_ROOT="$RUNNER_TEMP/pino-smoke-install"
          WORK_ROOT="$RUNNER_TEMP/pino-smoke-work"
          rm -rf "$INSTALL_ROOT" "$WORK_ROOT"
          mkdir -p "$INSTALL_ROOT" "$WORK_ROOT"

          tar -xzf '${{ matrix.file_name }}' -C "$INSTALL_ROOT"
          PINO_DIR="$INSTALL_ROOT/${{ matrix.artifact_name }}"
          if [ ! -x "$PINO_DIR/pino" ]; then
            echo "Expected unpacked executable at '$PINO_DIR/pino'." >&2
            exit 1
          fi

          export PATH="$PINO_DIR:$PATH"
          cd "$WORK_ROOT"
          pino version
          pino init demo
          cd demo
          pino run
          pino run --c < /dev/null
          pino test
          pino test --c < /dev/null
          pino play star_pino < /dev/null

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.file_name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum \
            pino-windows-x64.zip \
            pino-linux-x64.tar.gz \
            pino-macos-x64.tar.gz \
            pino-macos-arm64.tar.gz \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: ./artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/pino-windows-x64.zip
            ./artifacts/pino-linux-x64.tar.gz
            ./artifacts/pino-macos-x64.tar.gz
            ./artifacts/pino-macos-arm64.tar.gz
            ./artifacts/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
